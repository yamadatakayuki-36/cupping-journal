<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>カッピング評価ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1C1712;
    --surface: #2A2119;
    --surface-2: #241C15;
    --line: #4A3C2C;
    --amber: #C97C3D;
    --amber-soft: #E3A15C;
    --sage: #7A8B6F;
    --sage-soft: #9BAE8C;
    --text: #EDE3D3;
    --text-muted: #9C8F7C;
    --danger: #B5573F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    padding: 32px 16px 60px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  header.top {
    text-align: center;
    margin-bottom: 28px;
    position: relative;
  }
  header.top .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--sage-soft);
    text-transform: uppercase;
  }
  header.top h1 {
    font-family: 'Shippori Mincho', serif;
    font-weight: 700;
    font-size: 30px;
    margin: 6px 0 4px;
    letter-spacing: 0.04em;
  }
  header.top p.tagline {
    color: var(--text-muted);
    font-size: 13px;
    margin: 0;
  }

  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }
  .tab-btn {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 12px 8px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color .2s, border-color .2s;
  }
  .tab-btn.active { color: var(--amber-soft); border-bottom-color: var(--amber); }

  .view { display: none; }
  .view.active { display: block; }

  .ticket {
    background: var(--surface);
    border: 1px dashed var(--line);
    border-radius: 4px;
    padding: 24px 22px;
    position: relative;
  }
  .ticket::before, .ticket::after {
    content: "";
    position: absolute;
    width: 14px; height: 14px;
    background: var(--bg);
    border-radius: 50%;
    top: 50%;
    transform: translateY(-50%);
  }
  .ticket::before { left: -8px; }
  .ticket::after { right: -8px; }

  .section-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--sage-soft);
    margin: 22px 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-label:first-of-type { margin-top: 0; }
  .section-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .field-row.single { grid-template-columns: 1fr; }
  label.f {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  input[type=text], input[type=date], select, textarea {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 3px;
    padding: 9px 10px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
  }
  textarea { resize: vertical; min-height: 64px; line-height: 1.6; }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--amber);
  }

  .conclusion-preview {
    font-family: 'Shippori Mincho', serif;
    font-size: 16px;
    color: var(--amber-soft);
    background: var(--surface-2);
    border-left: 3px solid var(--amber);
    padding: 10px 14px;
    margin-bottom: 4px;
    min-height: 20px;
  }

  .rating-block { margin-bottom: 16px; }
  .rating-block .rlabel {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 4px;
  }
  .rating-block .rlabel span.val {
    font-family: 'JetBrains Mono', monospace;
    color: var(--amber-soft);
  }
  input[type=range] {
    width: 100%;
    accent-color: var(--amber);
  }

  .radar-wrap { display: flex; justify-content: center; margin: 8px 0 6px; }

  .fav-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 14px 0 20px;
  }
  .fav-row input { width: 16px; height: 16px; accent-color: var(--sage); }
  .fav-row label { font-size: 13px; color: var(--text-muted); }

  .actions { display: flex; gap: 10px; margin-top: 6px; }
  button.primary {
    flex: 1;
    background: var(--amber);
    color: #1C1712;
    border: none;
    border-radius: 3px;
    padding: 12px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    transition: background .2s;
  }
  button.primary:hover { background: var(--amber-soft); }
  button.ghost {
    background: none;
    border: 1px solid var(--line);
    color: var(--text-muted);
    border-radius: 3px;
    padding: 12px 16px;
    cursor: pointer;
    font-size: 13px;
  }

  .status-msg { font-size: 12px; color: var(--sage-soft); margin-top: 8px; min-height: 16px; }

  /* log list */
  .log-entry {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .log-entry .lhead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .log-entry .lhead h3 {
    font-family: 'Shippori Mincho', serif;
    font-size: 16px;
    margin: 0;
    color: var(--amber-soft);
  }
  .log-entry .lhead .date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .log-entry .meta {
    font-size: 12px;
    color: var(--text-muted);
    margin: 4px 0 10px;
  }
  .log-entry .notes {
    font-size: 13px;
    line-height: 1.7;
    color: var(--text);
    margin-bottom: 10px;
    white-space: pre-wrap;
  }
  .axis-bars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
  .axis-bar { text-align: center; }
  .axis-bar .name { font-size: 10px; color: var(--text-muted); margin-bottom: 4px; }
  .axis-bar .track { background: var(--surface-2); border-radius: 2px; height: 5px; overflow: hidden; }
  .axis-bar .fill { height: 100%; background: var(--sage); }
  .axis-bar .num { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--sage-soft); margin-top: 3px; }

  .del-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 11px;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
  }
  .del-btn:hover { color: var(--danger); }

  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--text-muted);
    font-size: 13px;
  }
  .empty-state .big { font-family: 'Shippori Mincho', serif; font-size: 18px; color: var(--text); margin-bottom: 8px; }

  .sort-row { display: flex; justify-content: flex-end; margin-bottom: 12px; }
  .sort-row select { width: auto; font-size: 12px; padding: 6px 8px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="eyebrow">Cupping Record</div>
    <h1>カッピング評価ツール</h1>
    <p class="tagline">記録するたびに、解像度が上がっていく</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-view="new">新規記録</button>
    <button class="tab-btn" data-view="list">記録一覧</button>
  </div>

  <!-- NEW ENTRY VIEW -->
  <div class="view active" id="view-new">
    <div class="ticket">

      <div class="conclusion-preview" id="conclusionPreview">豆の名前を入力すると、ここに一行結論が表示されます</div>

      <div class="section-label">事実</div>
      <div class="field-row">
        <div><label class="f">豆の名前</label><input type="text" id="beanName" placeholder="例）Guatemala Geisha Vista Farm"></div>
        <div><label class="f">産地</label><input type="text" id="origin" placeholder="例）グアテマラ"></div>
      </div>
      <div class="field-row">
        <div><label class="f">購入先・焙煎所</label><input type="text" id="roaster" placeholder="例）Tokiwa Coffee Roastery"></div>
        <div><label class="f">記録日</label><input type="date" id="cupDate"></div>
      </div>
      <div class="field-row">
        <div><label class="f">焙煎度</label>
          <select id="roastLevel">
            <option value="">選択してください</option>
            <option>浅煎り</option>
            <option>中浅煎り</option>
            <option>中煎り</option>
            <option>中深煎り</option>
            <option>深煎り</option>
          </select>
        </div>
        <div><label class="f">抽出・カッピング方法</label><input type="text" id="method" placeholder="例）カッピングボウル／ペーパードリップ"></div>
      </div>

      <div class="section-label">解釈</div>
      <div class="field-row single">
        <div>
          <label class="f">香り・酸味・甘みの言語化メモ（自由記述）</label>
          <textarea id="notes" placeholder="例）レモン・マスカットのような香り。酸味先行で、時間経過とともに厚みが出てくる。ハーバルな余韻。"></textarea>
        </div>
      </div>

      <div class="section-label">評価</div>

      <div class="rating-block">
        <div class="rlabel"><span>酸味</span><span class="val" id="v-acidity">3</span></div>
        <input type="range" min="1" max="5" value="3" id="r-acidity">
      </div>
      <div class="rating-block">
        <div class="rlabel"><span>甘み</span><span class="val" id="v-sweetness">3</span></div>
        <input type="range" min="1" max="5" value="3" id="r-sweetness">
      </div>
      <div class="rating-block">
        <div class="rlabel"><span>アロマの持続性</span><span class="val" id="v-aroma">3</span></div>
        <input type="range" min="1" max="5" value="3" id="r-aroma">
      </div>
      <div class="rating-block">
        <div class="rlabel"><span>複雑さ</span><span class="val" id="v-complexity">3</span></div>
        <input type="range" min="1" max="5" value="3" id="r-complexity">
      </div>

      <div class="radar-wrap">
        <svg id="radarSvg" width="220" height="200" viewBox="0 0 220 200"></svg>
      </div>

      <div class="fav-row">
        <input type="checkbox" id="isFav">
        <label for="isFav">◎ お気に入りタイプ（また飲みたい）</label>
      </div>

      <div class="actions">
        <button class="primary" id="saveBtn">記録を保存する</button>
        <button class="ghost" id="clearBtn">クリア</button>
      </div>
      <div class="status-msg" id="statusMsg"></div>
    </div>
  </div>

  <!-- LIST VIEW -->
  <div class="view" id="view-list">
    <div class="sort-row">
      <select id="sortOrder">
        <option value="new">新しい順</option>
        <option value="old">古い順</option>
        <option value="fav">お気に入りのみ</option>
      </select>
    </div>
    <div id="logList"></div>
  </div>

</div>

<script>
const axes = [
  { key: 'acidity', label: '酸味' },
  { key: 'sweetness', label: '甘み' },
  { key: 'aroma', label: 'アロマ持続' },
  { key: 'complexity', label: '複雑さ' }
];

function getRatings() {
  return {
    acidity: Number(document.getElementById('r-acidity').value),
    sweetness: Number(document.getElementById('r-sweetness').value),
    aroma: Number(document.getElementById('r-aroma').value),
    complexity: Number(document.getElementById('r-complexity').value)
  };
}

function drawRadar(svgEl, ratings) {
  const cx = 110, cy = 100, R = 78;
  const n = axes.length;
  const angleFor = i => (Math.PI * 2 * i / n) - Math.PI / 2;

  let svg = `<g>`;
  // grid rings
  for (let ring = 1; ring <= 5; ring++) {
    const r = R * ring / 5;
    let pts = [];
    for (let i = 0; i < n; i++) {
      const a = angleFor(i);
      pts.push(`${cx + r * Math.cos(a)},${cy + r * Math.sin(a)}`);
    }
    svg += `<polygon points="${pts.join(' ')}" fill="none" stroke="#4A3C2C" stroke-width="1" opacity="${ring===5?0.8:0.35}"/>`;
  }
  // axis lines + labels
  axes.forEach((ax, i) => {
    const a = angleFor(i);
    const x2 = cx + R * Math.cos(a), y2 = cy + R * Math.sin(a);
    svg += `<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="#4A3C2C" stroke-width="1"/>`;
    const lx = cx + (R + 18) * Math.cos(a), ly = cy + (R + 18) * Math.sin(a);
    svg += `<text x="${lx}" y="${ly}" fill="#9C8F7C" font-size="10" font-family="Noto Sans JP, sans-serif" text-anchor="middle" dominant-baseline="middle">${ax.label}</text>`;
  });
  // data polygon
  let dataPts = [];
  axes.forEach((ax, i) => {
    const a = angleFor(i);
    const val = ratings[ax.key] / 5;
    dataPts.push(`${cx + R * val * Math.cos(a)},${cy + R * val * Math.sin(a)}`);
  });
  svg += `<polygon points="${dataPts.join(' ')}" fill="#C97C3D" fill-opacity="0.35" stroke="#E3A15C" stroke-width="2"/>`;
  axes.forEach((ax, i) => {
    const a = angleFor(i);
    const val = ratings[ax.key] / 5;
    const px = cx + R * val * Math.cos(a), py = cy + R * val * Math.sin(a);
    svg += `<circle cx="${px}" cy="${py}" r="3" fill="#E3A15C"/>`;
  });
  svg += `</g>`;
  svgEl.innerHTML = svg;
}

function updateConclusionPreview() {
  const bean = document.getElementById('beanName').value.trim();
  const fav = document.getElementById('isFav').checked;
  const el = document.getElementById('conclusionPreview');
  if (!bean) {
    el.textContent = '豆の名前を入力すると、ここに一行結論が表示されます';
    return;
  }
  el.textContent = (fav ? '◎ 好みタイプ／' : '') + bean;
}

['r-acidity','r-sweetness','r-aroma','r-complexity'].forEach(id => {
  document.getElementById(id).addEventListener('input', e => {
    const key = id.replace('r-', '');
    document.getElementById('v-' + key).textContent = e.target.value;
    drawRadar(document.getElementById('radarSvg'), getRatings());
  });
});
document.getElementById('beanName').addEventListener('input', updateConclusionPreview);
document.getElementById('isFav').addEventListener('change', updateConclusionPreview);

drawRadar(document.getElementById('radarSvg'), getRatings());

// tabs
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-' + btn.dataset.view).classList.add('active');
    if (btn.dataset.view === 'list') renderList();
  });
});

function resetForm() {
  document.getElementById('beanName').value = '';
  document.getElementById('origin').value = '';
  document.getElementById('roaster').value = '';
  document.getElementById('cupDate').value = '';
  document.getElementById('roastLevel').value = '';
  document.getElementById('method').value = '';
  document.getElementById('notes').value = '';
  document.getElementById('isFav').checked = false;
  ['acidity','sweetness','aroma','complexity'].forEach(k => {
    document.getElementById('r-' + k).value = 3;
    document.getElementById('v-' + k).textContent = 3;
  });
  updateConclusionPreview();
  drawRadar(document.getElementById('radarSvg'), getRatings());
}
document.getElementById('clearBtn').addEventListener('click', resetForm);

document.getElementById('saveBtn').addEventListener('click', async () => {
  const bean = document.getElementById('beanName').value.trim();
  const statusEl = document.getElementById('statusMsg');
  if (!bean) {
    statusEl.textContent = '豆の名前を入力してください。';
    statusEl.style.color = '#B5573F';
    return;
  }
  const entry = {
    id: 'cupping_' + Date.now(),
    beanName: bean,
    origin: document.getElementById('origin').value.trim(),
    roaster: document.getElementById('roaster').value.trim(),
    cupDate: document.getElementById('cupDate').value,
    roastLevel: document.getElementById('roastLevel').value,
    method: document.getElementById('method').value.trim(),
    notes: document.getElementById('notes').value.trim(),
    isFav: document.getElementById('isFav').checked,
    ratings: getRatings(),
    savedAt: Date.now()
  };
  try {
    const res = await window.storage.set(entry.id, JSON.stringify(entry), false);
    if (!res) throw new Error('no result');
    statusEl.style.color = '#9BAE8C';
    statusEl.textContent = '保存しました。「記録一覧」タブで確認できます。';
    resetForm();
  } catch (e) {
    statusEl.style.color = '#B5573F';
    statusEl.textContent = '保存に失敗しました。もう一度お試しください。';
    console.error(e);
  }
});

async function loadAllEntries() {
  try {
    const listRes = await window.storage.list('cupping_', false);
    if (!listRes || !listRes.keys || listRes.keys.length === 0) return [];
    const entries = [];
    for (const key of listRes.keys) {
      try {
        const r = await window.storage.get(key, false);
        if (r && r.value) entries.push(JSON.parse(r.value));
      } catch (e) { /* skip missing */ }
    }
    return entries;
  } catch (e) {
    console.error(e);
    return [];
  }
}

async function renderList() {
  const container = document.getElementById('logList');
  container.innerHTML = '<div class="empty-state">読み込み中...</div>';
  let entries = await loadAllEntries();

  const sortVal = document.getElementById('sortOrder').value;
  if (sortVal === 'new') entries.sort((a,b) => b.savedAt - a.savedAt);
  else if (sortVal === 'old') entries.sort((a,b) => a.savedAt - b.savedAt);
  else if (sortVal === 'fav') entries = entries.filter(e => e.isFav).sort((a,b) => b.savedAt - a.savedAt);

  if (entries.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="big">まだ記録がありません</div>「新規記録」タブから、最初のカッピングを記録してみましょう。</div>';
    return;
  }

  container.innerHTML = entries.map(e => {
    const metaParts = [e.origin, e.roaster, e.roastLevel, e.cupDate].filter(Boolean);
    const axisBars = axes.map(ax => {
      const val = e.ratings ? (e.ratings[ax.key] || 0) : 0;
      return `<div class="axis-bar">
        <div class="name">${ax.label}</div>
        <div class="track"><div class="fill" style="width:${val*20}%"></div></div>
        <div class="num">${val}/5</div>
      </div>`;
    }).join('');
    return `<div class="log-entry" data-id="${e.id}">
      <div class="lhead">
        <h3>${e.isFav ? '◎ ' : ''}${escapeHtml(e.beanName)}</h3>
        <span class="date">${e.cupDate || ''}</span>
      </div>
      <div class="meta">${metaParts.map(escapeHtml).join(' ／ ')}</div>
      <div class="axis-bars">${axisBars}</div>
      ${e.notes ? `<div class="notes">${escapeHtml(e.notes)}</div>` : ''}
      <button class="del-btn" data-del="${e.id}">この記録を削除</button>
    </div>`;
  }).join('');

  container.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('この記録を削除しますか？')) return;
      await window.storage.delete(btn.dataset.del, false);
      renderList();
    });
  });
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('sortOrder').addEventListener('change', renderList);
document.getElementById('cupDate').valueAsDate = new Date();
</script>
</body>
</html>
